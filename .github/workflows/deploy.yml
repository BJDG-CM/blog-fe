name: Deploy GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: node .yarn/releases/yarn-3.3.1.cjs install --immutable

      - name: Build site
        env:
          PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}/"
          PUBLIC_SITE_URL: "https://yejunlee.com/${{ github.event.repository.name }}/"
          PUBLIC_PRIVATE_MODE: "${{ vars.PRIVATE_MODE || 'false' }}"
          PRIVATE_PASSPHRASE: "${{ secrets.PRIVATE_PASSPHRASE }}"
        run: node .yarn/releases/yarn-3.3.1.cjs workspace blog-site build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
